  <style>
    @page {
      size: 210mm 535mm;
      margin: 0mm;
    }

    /* Fix html2canvas FontMetrics baseline calculation */
    img[src^="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP"] {
      display: inline !important;
      vertical-align: baseline !important;
    }

    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: 20px 12px 36px 12px;
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      color: #0f172a;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    html[data-theme="dark"] body {
      background-color: #020617;
      color: #f8fafc;
    }

    /* Barra superior exclusiva de la vista previa (NO sale en el PDF) */
    .preview-toolbar {
      width: 794px;
      max-width: 100%;
      margin: 0 auto 16px auto;
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
      box-sizing: border-box;
      position: sticky;
      top: 12px;
      z-index: 100;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    html[data-theme="dark"] .preview-toolbar {
      background-color: #0f172a;
      border-color: #1e293b;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
    }

    .toolbar-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .toolbar-divider {
      width: 1px;
      height: 22px;
      background-color: #e2e8f0;
    }

    html[data-theme="dark"] .toolbar-divider {
      background-color: #1e293b;
    }

    .toolbar-label {
      font-size: 11.5px;
      font-weight: 600;
      color: #475569;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    html[data-theme="dark"] .toolbar-label {
      color: #94a3b8;
    }

    .switch-pill-group {
      display: inline-flex;
      background-color: #f1f5f9;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid #e2e8f0;
      gap: 3px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    html[data-theme="dark"] .switch-pill-group {
      background-color: #020617;
      border-color: #1e293b;
    }

    .switch-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #475569;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s ease;
    }

    html[data-theme="dark"] .switch-btn {
      color: #94a3b8;
    }

    .switch-btn:hover {
      color: #0f172a;
    }

    html[data-theme="dark"] .switch-btn:hover {
      color: #f8fafc;
    }

    .switch-btn.active {
      background-color: #ffffff;
      color: #2563eb;
      box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
    }

    html[data-theme="dark"] .switch-btn.active {
      background-color: #1e293b;
      color: #38bdf8;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.35);
    }

    .download-pdf-btn {
      appearance: none;
      border: none;
      background-color: #2563eb;
      color: #ffffff;
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease, opacity 0.15s ease;
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.25);
    }

    .download-pdf-btn:hover:not(:disabled) {
      background-color: #1d4ed8;
    }

    .download-pdf-btn:disabled {
      opacity: 0.7;
      cursor: wait;
    }

    html[data-theme="dark"] .download-pdf-btn {
      background-color: #0284c7;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.22);
    }

    html[data-theme="dark"] .download-pdf-btn:hover:not(:disabled) {
      background-color: #0369a1;
    }

    /* Estilos encapsulados del documento CV (#cv-export-root) */
    #cv-export-root,
    #cv-export-root *,
    #cv-export-root *::before,
    #cv-export-root *::after {
      box-sizing: border-box;
    }

    #cv-export-root {
      width: 794px;
      max-width: 794px;
      margin: 0 auto;
      background-color: #ffffff;
      color: #0f172a;
      font-family: 'Inter', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.58;
      -webkit-font-smoothing: antialiased;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
      padding: 50px 48px;
      text-align: left;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.07), 0 0 0 1px rgba(0, 0, 0, 0.03);
      border-radius: 6px;
      transition: background-color 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    html[data-theme="dark"] #cv-export-root {
      background-color: #0b1120;
      color: #f8fafc;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.55), 0 0 0 1px #1e293b;
    }

    #cv-export-root h1,
    #cv-export-root h2,
    #cv-export-root h3,
    #cv-export-root p,
    #cv-export-root div,
    #cv-export-root span,
    #cv-export-root header,
    #cv-export-root section,
    #cv-export-root footer {
      margin: 0;
      padding: 0;
    }

    /* Encabezado */
    #cv-export-root .header-card {
      background-color: #ffffff;
      border: 1px solid #e2e8f0;
      border-left: 5px solid #2563eb;
      border-radius: 10px;
      padding: 20px 22px;
      margin-bottom: 21px;
      display: flex;
      align-items: center;
      gap: 18px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.03);
    }

    html[data-theme="dark"] #cv-export-root .header-card {
      background: linear-gradient(135deg, #0f172a 0%, #111827 100%);
      border: 1px solid #1e293b;
      border-left: 5px solid #38bdf8;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }

    #cv-export-root .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
      width: 82px;
      height: 82px;
      border-radius: 50%;
      overflow: hidden;
      border: 2.5px solid #2563eb;
      background-color: #f8fafc;
    }

    html[data-theme="dark"] #cv-export-root .avatar-wrapper {
      border-color: #38bdf8;
      background-color: #0f172a;
    }

    #cv-export-root .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    #cv-export-root .header-info {
      flex: 1;
      min-width: 0;
    }

    #cv-export-root .header-name {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin: 0 0 9px 0;
      color: #0f172a;
      line-height: 1.22;
    }

    html[data-theme="dark"] #cv-export-root .header-name {
      color: #f8fafc;
    }

    #cv-export-root .header-role {
      display: inline-block;
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: #1d4ed8;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      padding: 5.5px 11px;
      border-radius: 6px;
      margin: 0 0 13px 0;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .header-role {
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.3);
    }

    #cv-export-root .header-contacts {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 9px 16px;
      font-size: 10.5px;
      color: #475569;
      line-height: 1.48;
    }

    html[data-theme="dark"] #cv-export-root .header-contacts {
      color: #cbd5e1;
    }

    #cv-export-root .meta-item {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: #475569;
      text-decoration: none;
    }

    html[data-theme="dark"] #cv-export-root .meta-item {
      color: #cbd5e1;
    }

    #cv-export-root .meta-icon {
      color: #2563eb;
      flex-shrink: 0;
    }

    html[data-theme="dark"] #cv-export-root .meta-icon {
      color: #38bdf8;
    }

    /* Bloques de Sección */
    #cv-export-root .cv-section {
      margin-bottom: 21px;
    }

    #cv-export-root .section-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    #cv-export-root .section-icon {
      color: #2563eb;
      display: inline-flex;
      align-items: center;
      flex-shrink: 0;
    }

    html[data-theme="dark"] #cv-export-root .section-icon {
      color: #38bdf8;
    }

    #cv-export-root .section-title-text {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.6px;
      color: #0f172a;
      text-transform: uppercase;
      line-height: 1.32;
    }

    html[data-theme="dark"] #cv-export-root .section-title-text {
      color: #f8fafc;
    }

    #cv-export-root .section-divider {
      flex: 1;
      height: 1px;
      background: #e2e8f0;
    }

    html[data-theme="dark"] #cv-export-root .section-divider {
      background: #1e293b;
    }

    /* Perfil Profesional */
    #cv-export-root .profile-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-left: 3.5px solid #2563eb;
      border-radius: 0 8px 8px 0;
      padding: 15px 16px;
      font-size: 10.8px;
      color: #334155;
      line-height: 1.65;
    }

    html[data-theme="dark"] #cv-export-root .profile-card {
      background-color: #0f172a;
      border-color: #1e293b;
      border-left-color: #38bdf8;
      color: #cbd5e1;
    }

    /* Línea de Tiempo de Experiencia */
    #cv-export-root .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #cv-export-root .timeline-job {
      position: relative;
      padding-left: 17px;
      border-left: 2px solid #bfdbfe;
    }

    html[data-theme="dark"] #cv-export-root .timeline-job {
      border-left-color: rgba(56, 189, 248, 0.35);
    }

    #cv-export-root .timeline-job:last-child {
      border-left: 2px solid #e2e8f0;
    }

    html[data-theme="dark"] #cv-export-root .timeline-job:last-child {
      border-left-color: #1e293b;
    }

    #cv-export-root .timeline-node {
      position: absolute;
      left: -6px;
      top: 4px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #2563eb;
      border: 2px solid #ffffff;
      box-shadow: 0 0 0 1.5px #bfdbfe;
    }

    html[data-theme="dark"] #cv-export-root .timeline-node {
      background-color: #38bdf8;
      border-color: #0b1120;
      box-shadow: 0 0 0 1.5px rgba(56, 189, 248, 0.4);
    }

    #cv-export-root .job-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 7px;
    }

    #cv-export-root .job-role {
      font-size: 13.2px;
      font-weight: 700;
      color: #1d4ed8;
      line-height: 1.32;
    }

    html[data-theme="dark"] #cv-export-root .job-role {
      color: #38bdf8;
    }

    #cv-export-root .job-company-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #0f172a;
      margin-top: 5.5px;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .job-company-row {
      color: #f8fafc;
    }

    #cv-export-root .job-company {
      font-weight: 700;
    }

    #cv-export-root .job-location {
      color: #64748b;
      font-size: 10px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    html[data-theme="dark"] #cv-export-root .job-location {
      color: #94a3b8;
    }

    #cv-export-root .job-period-pill {
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      font-size: 9.6px;
      font-weight: 600;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
      padding: 5px 9.5px;
      border-radius: 12px;
      white-space: nowrap;
      flex-shrink: 0;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .job-period-pill {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border-color: rgba(56, 189, 248, 0.28);
    }

    #cv-export-root .job-desc {
      font-size: 10.6px;
      color: #334155;
      margin: 7px 0 10px 0;
      line-height: 1.58;
    }

    html[data-theme="dark"] #cv-export-root .job-desc {
      color: #cbd5e1;
    }

    #cv-export-root .achievements-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
      margin-bottom: 7px;
    }

    #cv-export-root .achievement-item {
      display: flex;
      align-items: flex-start;
      gap: 6px;
      font-size: 10.2px;
      color: #475569;
      line-height: 1.55;
    }

    html[data-theme="dark"] #cv-export-root .achievement-item {
      color: #cbd5e1;
    }

    #cv-export-root .achievement-bullet {
      color: #2563eb;
      flex-shrink: 0;
      font-size: 10px;
      line-height: 1.48;
    }

    html[data-theme="dark"] #cv-export-root .achievement-bullet {
      color: #38bdf8;
    }

    #cv-export-root .job-tech-stack {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    #cv-export-root .tech-pill {
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      font-size: 9.2px;
      font-weight: 500;
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      padding: 4.5px 7.5px;
      border-radius: 4px;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .tech-pill {
      background-color: #1e293b;
      border-color: #334155;
      color: #e2e8f0;
    }

    /* Proyectos Destacados */
    #cv-export-root .projects-grid {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    #cv-export-root .project-card {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 13.5px 15px;
    }

    html[data-theme="dark"] #cv-export-root .project-card {
      background-color: #0f172a;
      border-color: #1e293b;
    }

    #cv-export-root .project-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
    }

    #cv-export-root .project-title-wrap {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    #cv-export-root .project-title {
      font-size: 11.8px;
      font-weight: 700;
      color: #1d4ed8;
      line-height: 1.32;
    }

    html[data-theme="dark"] #cv-export-root .project-title {
      color: #38bdf8;
    }

    #cv-export-root .project-sector-tag {
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      font-size: 8.8px;
      font-weight: 600;
      padding: 4px 7px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #475569;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .project-sector-tag {
      background: #1e293b;
      border-color: #334155;
      color: #e2e8f0;
    }

    #cv-export-root .project-desc {
      font-size: 10.2px;
      color: #334155;
      line-height: 1.56;
      margin: 0 0 10px 0;
    }

    html[data-theme="dark"] #cv-export-root .project-desc {
      color: #cbd5e1;
    }

    #cv-export-root .project-impact {
      font-size: 9px;
      font-weight: 600;
      color: #059669;
      display: inline-flex;
      align-items: center;
      gap: 3.5px;
      flex-shrink: 0;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .project-impact {
      color: #34d399;
    }

    /* 2 Columnas: Habilidades y Certificaciones/Idiomas */
    #cv-export-root .bottom-cols-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 21px;
      margin-bottom: 21px;
    }

    #cv-export-root .skills-category {
      margin-bottom: 14px;
    }

    #cv-export-root .skills-category:last-child {
      margin-bottom: 0;
    }

    #cv-export-root .skills-cat-title {
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      font-size: 9.6px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      margin-bottom: 8px;
      color: #2563eb;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .skills-cat-title {
      color: #38bdf8;
    }

    #cv-export-root .skills-badges-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    #cv-export-root .skill-chip {
      font-size: 9.6px;
      font-weight: 500;
      padding: 5px 8.5px;
      border-radius: 5px;
      line-height: 1.38;
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1d4ed8;
    }

    html[data-theme="dark"] #cv-export-root .skill-chip {
      background-color: rgba(56, 189, 248, 0.12);
      border-color: rgba(56, 189, 248, 0.28);
      color: #38bdf8;
    }

    #cv-export-root .cert-list {
      margin-bottom: 14px;
    }

    #cv-export-root .cert-item {
      background-color: #f8fafc;
      border-left: 3px solid #2563eb;
      border-top: 1px solid #e2e8f0;
      border-right: 1px solid #e2e8f0;
      border-bottom: 1px solid #e2e8f0;
      border-radius: 0 5px 5px 0;
      padding: 8.5px 10px;
      font-size: 9.6px;
      font-weight: 500;
      color: #0f172a;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .cert-item {
      background-color: #0f172a;
      border-left-color: #38bdf8;
      border-top-color: #1e293b;
      border-right-color: #1e293b;
      border-bottom-color: #1e293b;
      color: #f1f5f9;
    }

    #cv-export-root .cert-issuer {
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      font-size: 8.6px;
      color: #64748b;
      flex-shrink: 0;
    }

    html[data-theme="dark"] #cv-export-root .cert-issuer {
      color: #94a3b8;
    }

    #cv-export-root .lang-item {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 8.5px 10px;
      margin-bottom: 8px;
    }

    html[data-theme="dark"] #cv-export-root .lang-item {
      background-color: #0f172a;
      border-color: #1e293b;
    }

    #cv-export-root .lang-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9.6px;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 6.5px;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .lang-header {
      color: #f1f5f9;
    }

    #cv-export-root .lang-level-badge {
      font-size: 8.6px;
      color: #64748b;
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
    }

    html[data-theme="dark"] #cv-export-root .lang-level-badge {
      color: #94a3b8;
    }

    #cv-export-root .lang-track {
      background-color: #e2e8f0;
      border-radius: 3px;
      height: 5px;
      width: 100%;
      overflow: hidden;
    }

    html[data-theme="dark"] #cv-export-root .lang-track {
      background-color: #1e293b;
    }

    #cv-export-root .lang-fill {
      background-color: #2563eb;
      height: 100%;
      border-radius: 3px;
    }

    html[data-theme="dark"] #cv-export-root .lang-fill {
      background-color: #38bdf8;
    }

    /* Referencias */
    #cv-export-root .references-section {
      margin-bottom: 19px;
    }

    #cv-export-root .ref-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 13px;
    }

    #cv-export-root .ref-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 11.5px 11.5px;
      font-size: 9.2px;
    }

    html[data-theme="dark"] #cv-export-root .ref-box {
      background-color: #0f172a;
      border-color: #1e293b;
    }

    #cv-export-root .ref-name {
      font-weight: 700;
      color: #0f172a;
      font-size: 9.8px;
      margin-bottom: 5.5px;
      line-height: 1.32;
    }

    html[data-theme="dark"] #cv-export-root .ref-name {
      color: #f8fafc;
    }

    #cv-export-root .ref-role {
      color: #475569;
      font-size: 8.7px;
      line-height: 1.4;
      margin-bottom: 7px;
    }

    html[data-theme="dark"] #cv-export-root .ref-role {
      color: #cbd5e1;
    }

    #cv-export-root .ref-contact {
      color: #64748b;
      font-size: 8.5px;
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      display: flex;
      flex-direction: column;
      gap: 4.5px;
      line-height: 1.32;
    }

    html[data-theme="dark"] #cv-export-root .ref-contact {
      color: #94a3b8;
    }

    /* Footer */
    #cv-export-root .cv-footer {
      border-top: 1px solid #e2e8f0;
      padding-top: 11px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 9px;
      color: #94a3b8;
      font-family: 'JetBrains Mono', 'Cascadia Mono', 'Consolas', monospace;
      line-height: 1.38;
    }

    html[data-theme="dark"] #cv-export-root .cv-footer {
      border-top-color: #1e293b;
      color: #64748b;
    }

    @media print {
      body {
        padding: 0 !important;
      }
      .preview-toolbar {
        display: none !important;
      }
      #cv-export-root {
        box-shadow: none !important;
        border-radius: 0 !important;
      }
    }
  </style>
</head>

    function updateToolbarLabels() {
      const isEs = currentLang === "es";
      const themeCap = currentTheme === "dark" ? "Dark" : "Light";

      const langLabelEl = document.querySelector("#toolbar-lang-label span");
      if (langLabelEl) {
        langLabelEl.textContent = isEs ? "Idioma:" : "Language:";
      }

      const themeLabelEl = document.querySelector("#toolbar-theme-label span");
      if (themeLabelEl) {
        themeLabelEl.textContent = isEs ? "Tema:" : "Theme:";
      }

      const dlText = document.getElementById("download-btn-text");
      if (dlText) {
        dlText.textContent = isEs
          ? "Descargar PDF (" + currentLang.toUpperCase() + " • " + themeCap + ")"
          : "Download PDF (" + currentLang.toUpperCase() + " • " + themeCap + ")";
      }
    }

    function setCvLanguage(lang) {
      currentLang = lang === "en" ? "en" : "es";
      document.documentElement.lang = currentLang;

      const btnEs = document.getElementById("btn-lang-es");
      const btnEn = document.getElementById("btn-lang-en");
      if (btnEs && btnEn) {
        btnEs.classList.toggle("active", currentLang === "es");
        btnEn.classList.toggle("active", currentLang === "en");
      }

      updateToolbarLabels();
      renderCvMarkup(currentLang);
    }

    function setCvTheme(theme) {
      currentTheme = theme === "dark" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", currentTheme);

      const btnLight = document.getElementById("btn-theme-light");
      const btnDark = document.getElementById("btn-theme-dark");
      if (btnLight && btnDark) {
        btnLight.classList.toggle("active", currentTheme === "light");
        btnDark.classList.toggle("active", currentTheme === "dark");
      }

      updateToolbarLabels();
    }

    async function downloadCurrentCvPdf() {
      const btn = document.getElementById("btn-download-pdf");
      const dlText = document.getElementById("download-btn-text");
      const suffix = currentTheme === "dark" ? "_Dark" : "";
      const filename = "Mateo_Padilla_CV_" + currentLang.toUpperCase() + suffix + ".pdf";

      if (btn) btn.disabled = true;
      if (dlText) {
        dlText.textContent = currentLang === "es" ? "Generando PDF..." : "Generating PDF...";
      }

      try {
        // Generación dinámica en el navegador (html2pdf.js con corrección de FontMetrics)
        const target = document.getElementById("cv-export-root");
        if (typeof html2pdf !== "undefined" && target) {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
          const rect = target.getBoundingClientRect();
          const widthPx = 794;
          const heightPx = Math.ceil(Math.max(target.scrollHeight, rect.height, 1123));
          const pdfWidthMm = 210;
          const pdfHeightMm = Math.ceil((heightPx * pdfWidthMm) / widthPx) + 2;

          await html2pdf()
            .set({
              margin: 0,
              filename: filename,
              image: { type: "jpeg", quality: 0.98 },
              html2canvas: {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: currentTheme === "dark" ? "#0b1120" : "#ffffff",
                width: widthPx,
                height: heightPx,
                windowWidth: widthPx,
                windowHeight: heightPx,
                scrollX: 0,
                scrollY: 0
              },
              jsPDF: {
                unit: "mm",
                format: [pdfWidthMm, pdfHeightMm],
                orientation: "portrait"
              },
              pagebreak: { mode: ["avoid-all"] }
            })
            .from(target)
            .save();
        } else {
          window.print();
        }
      } catch (err) {
        console.error("Error generating PDF:", err);
        window.print();
      } finally {
        if (btn) btn.disabled = false;
        updateToolbarLabels();
      }
    }

    // Inicializar según query params ?lang=es|en y ?theme=light|dark
    (function initPreview() {
      let initialLang = "es";
      let initialTheme = "light";
      try {
        const params = new URLSearchParams(window.location.search);
        const langParam = params.get("lang");
        const themeParam = params.get("theme");
        if (langParam === "en" || langParam === "es") {
          initialLang = langParam;
        }
        if (themeParam === "dark" || themeParam === "light") {
          initialTheme = themeParam;
        }
      } catch (e) {}
      setCvTheme(initialTheme);
      setCvLanguage(initialLang);
    })();
  </script>
